<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>TimeTracker</title>
<style>
  :root { --bg:#05060c; --card:#10131f; --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
    --text:#eef1f8; --muted:#8b93ab; --muted2:#5d6478; --success:#3fcf68; --warn:#f5a623; --danger:#f2555a;
    --grad:linear-gradient(135deg,#4f7dff,#8b5cf6); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; user-select:none; overflow:hidden; }
  button, input { font:inherit; }
  button { cursor:pointer; }
  .view { display:none; height:100%; padding:28px 30px; flex-direction:column; }
  .view.show { display:flex; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; margin-bottom:26px; }
  .logo img { width:28px; height:28px; border-radius:8px; }
  h1 { font-size:22px; letter-spacing:-.6px; margin-bottom:6px; }
  .sub { color:var(--muted); font-size:13px; line-height:1.5; margin-bottom:20px; }
  .field { width:100%; padding:12px 14px; margin-bottom:10px; border-radius:10px; border:1px solid var(--border2);
    background:rgba(255,255,255,.035); color:var(--text); font-size:14px; }
  .field:focus { outline:none; border-color:rgba(79,125,255,.8); }
  .btn { width:100%; padding:13px; border:none; border-radius:11px; background:var(--grad); color:#fff; font-weight:600; font-size:14.5px; }
  .btn.ghost { background:rgba(255,255,255,.06); border:1px solid var(--border2); color:var(--text); }
  .btn.danger { background:var(--danger); }
  .btn[disabled] { opacity:.5; cursor:default; }
  .link { background:none; border:none; color:var(--muted); font-size:12.5px; padding:6px; }
  .link:hover { color:var(--text); }
  .err { color:var(--danger); font-size:12.5px; min-height:16px; margin:2px 0 8px; }
  .otp { display:flex; gap:8px; margin-bottom:12px; }
  .otp input { flex:1; height:54px; text-align:center; font-size:22px; font-weight:700; border-radius:10px;
    border:1px solid var(--border2); background:rgba(255,255,255,.035); color:var(--text); font-family:Consolas,Menlo,monospace; }
  .otp input:focus { outline:none; border-color:rgba(79,125,255,.85); }
  .eyewrap { position:relative; } .eye { position:absolute; right:10px; top:9px; background:none; border:none; color:var(--muted); font-size:15px; }

  /* timer view */
  .top { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .top .av { width:34px; height:34px; border-radius:50%; background:var(--grad); display:grid; place-items:center; font-size:12px; font-weight:700; }
  .top .nm { font-weight:600; font-size:14px; } .top small { display:block; color:var(--muted2); font-size:11.5px; }
  .pill { margin-left:auto; padding:4px 10px; border-radius:99px; font-size:11.5px; font-weight:600; background:rgba(255,255,255,.07); color:var(--muted); }
  .pill.on { background:rgba(63,207,104,.15); color:var(--success); }
  .timer { text-align:center; padding:26px 0 18px; }
  .timer .t { font-size:54px; font-weight:800; letter-spacing:-2px; font-variant-numeric:tabular-nums; line-height:1; }
  .timer .l { color:var(--muted2); font-size:12px; margin-top:8px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .stat .l { color:var(--muted2); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; }
  .stat .v { font-size:20px; font-weight:700; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { height:6px; border-radius:3px; background:rgba(255,255,255,.08); margin-top:8px; overflow:hidden; }
  .bar span { display:block; height:100%; border-radius:3px; transition:width .4s; }
  .foot { margin-top:auto; display:flex; justify-content:space-between; }
  .note { color:var(--muted2); font-size:11.5px; text-align:center; margin-top:12px; line-height:1.5; }
</style>
</head>
<body>

<div class="view" id="auth">
  <div class="logo"><img src="../build/icon.png" alt=""><span>TimeTracker</span></div>
  <h1 id="aTitle">Log in</h1>
  <div class="sub" id="aSub">Sign in with the account you created on the website.</div>
  <input id="email" class="field" type="email" placeholder="Work email">
  <div class="eyewrap" id="pwWrap"><input id="password" class="field" type="password" placeholder="Password">
    <button class="eye" id="eye" type="button">👁</button></div>
  <div class="otp" id="otp" style="display:none">
    <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
  </div>
  <div class="err" id="aErr"></div>
  <button class="btn" id="aBtn">Log in</button>
  <div style="display:flex;flex-direction:column;margin-top:10px">
    <button class="link" id="resend" style="display:none">Send a new code</button>
    <button class="link" id="toggle">Don't have an account? Create one</button>
    <button class="link" id="forgot">Forgot your password? Reset it on the website</button>
  </div>
</div>

<div class="view" id="main">
  <div class="top">
    <div class="av" id="av">–</div>
    <div><div class="nm" id="name">–</div><small id="email2">–</small></div>
    <span class="pill" id="pill">Clocked out</span>
  </div>
  <div class="timer"><div class="t" id="clock">00:00:00</div><div class="l" id="clockL">Not clocked in</div></div>
  <button class="btn" id="clockBtn">Clock in</button>
  <div class="stats">
    <div class="stat"><div class="l">Activity (last minute)</div><div class="v" id="act">–</div><div class="bar"><span id="actBar" style="width:0"></span></div></div>
    <div class="stat"><div class="l">Current app</div><div class="v" id="app" style="font-size:15px;margin-top:8px">–</div></div>
  </div>
  <div class="note">Tracks activity every minute and takes a screenshot every 10 minutes while clocked in.<br>Closing the window keeps tracking in the tray.</div>
  <div class="foot">
    <button class="link" id="web">Open dashboard</button>
    <button class="link" id="logout">Log out</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let mode = "login", pendingEmail = "";
const boxes = [...document.querySelectorAll("#otp input")];
const code = () => boxes.map(b => b.value).join("");
boxes.forEach((b, i) => {
  b.addEventListener("input", () => {
    const d = b.value.replace(/\D/g, "");
    if (d.length > 1) { d.split("").forEach((c, k) => boxes[i + k] && (boxes[i + k].value = c)); boxes[Math.min(i + d.length, 5)].focus(); }
    else { b.value = d; if (d && boxes[i + 1]) boxes[i + 1].focus(); }
    if (code().length === 6) submit();
  });
  b.addEventListener("keydown", e => { if (e.key === "Backspace" && !b.value && boxes[i - 1]) { boxes[i - 1].value = ""; boxes[i - 1].focus(); } });
});

function applyMode() {
  const c = { login: ["Log in", "Sign in with the account you created on the website.", "Log in"],
    register: ["Create your account", "We'll email you a 6-digit code to confirm it.", "Create account"],
    verify: ["Check your email", `We sent a 6-digit code to ${pendingEmail}.`, "Verify"] }[mode];
  $("aTitle").textContent = c[0]; $("aSub").textContent = c[1]; $("aBtn").textContent = c[2];
  $("email").style.display = mode === "verify" ? "none" : ""; $("pwWrap").style.display = mode === "verify" ? "none" : "";
  $("otp").style.display = mode === "verify" ? "flex" : "none"; $("resend").style.display = mode === "verify" ? "" : "none";
  $("toggle").textContent = mode === "login" ? "Don't have an account? Create one" : "Already have an account? Log in";
  $("aErr").textContent = "";
}
$("toggle").onclick = () => { mode = mode === "login" ? "register" : "login"; applyMode(); };
$("forgot").onclick = () => tt.openWebsite();
$("eye").onclick = () => { const p = $("password"); p.type = p.type === "password" ? "text" : "password"; };
$("resend").onclick = async () => { try { await tt.resend(pendingEmail); $("aErr").style.color = "var(--success)"; $("aErr").textContent = "New code sent."; } catch (e) { $("aErr").textContent = e.message; } };
$("aBtn").onclick = submit;
["email", "password"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") submit(); }));

async function submit() {
  const email = $("email").value.trim(), password = $("password").value;
  $("aErr").style.color = "var(--danger)"; $("aErr").textContent = ""; $("aBtn").disabled = true;
  try {
    if (mode === "login") { if (!email.includes("@") || !password) throw new Error("Enter your email and password."); render(await tt.login(email, password)); }
    else if (mode === "register") {
      if (password.length < 8 || !/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) throw new Error("Password: at least 8 characters with letters and numbers.");
      const r = await tt.register(email, password);
      if (r.pending) { pendingEmail = email; mode = "verify"; applyMode(); boxes[0].focus(); }
    } else if (mode === "verify") { if (code().length < 6) throw new Error("Enter the 6-digit code."); render(await tt.verify(pendingEmail, code())); }
  } catch (e) { $("aErr").textContent = (e.message || "").replace(/^Error invoking remote method '\w+': Error: /, ""); boxes.forEach(b => b.value = ""); }
  finally { $("aBtn").disabled = false; }
}

// ---- timer view ----
let state = null;
function hms(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }
function render(s) {
  state = s;
  $("auth").classList.toggle("show", !s.loggedIn); $("main").classList.toggle("show", s.loggedIn);
  if (!s.loggedIn) { mode = "login"; applyMode(); return; }
  $("name").textContent = s.user.name || s.user.email; $("email2").textContent = s.user.email;
  $("av").textContent = (s.user.name || s.user.email).slice(0, 2).toUpperCase();
  $("pill").textContent = s.clockedIn ? "Tracking" : "Clocked out"; $("pill").className = "pill" + (s.clockedIn ? " on" : "");
  $("clockBtn").textContent = s.clockedIn ? "Clock out" : "Clock in"; $("clockBtn").className = "btn" + (s.clockedIn ? " danger" : "");
  $("clockL").textContent = s.clockedIn ? "Today · clocked in since " + new Date(s.since).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "Today · not clocked in";
  const a = s.activity; $("act").textContent = a == null ? "–" : a + "%";
  const color = a == null ? "var(--muted2)" : a >= 66 ? "var(--success)" : a >= 33 ? "var(--warn)" : "var(--danger)";
  $("act").style.color = color; $("actBar").style.width = (a || 0) + "%"; $("actBar").style.background = color;
  $("app").textContent = s.app || "–";
  tick();
}
function tick() { if (state && state.loggedIn) $("clock").textContent = hms(state.todaySeconds + (state.clockedIn ? 0 : 0)); }
setInterval(() => { if (state && state.clockedIn) { state.todaySeconds += 1; tick(); } }, 1000);
$("clockBtn").onclick = async () => { $("clockBtn").disabled = true; try { render(await tt.clock(!state.clockedIn)); } finally { $("clockBtn").disabled = false; } };
$("logout").onclick = async () => render(await tt.logout());
$("web").onclick = () => tt.openWebsite();
tt.onState(render);
tt.state().then(render);
applyMode();
</script>
</body>
</html>
